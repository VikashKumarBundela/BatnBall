const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const drift=f=>Math.round((f+(50-f)*0.1)*10)/10;
const batPerf=(r,b)=>b?clamp((r-1.24*b)/30,-1,1):0;
const bowlPerf=(w,r,b)=>b?clamp((1.35*b-r)/24+(w-0.05*b)*0.4,-1,1):0;
const FN=['Aarav','Vihaan','Arjun','Rohan','Ishan','Kabir','Dev','Rahul','Karan','Yash','Nikhil','Sahil','Aditya','Manav','Tushar','Reyansh','Vivaan','Krish','Harsh','Tanmay','Pranav','Siddharth','Varun','Ayaan'];

const SQUAD_ROLES=['Opener','Opener','Top order','Middle order','Middle order','All-rounder','All-rounder','Spinner','Fast bowler','Fast bowler','Spinner','Opener','Middle order','Fast bowler','All-rounder'];
const PERS=['Aggressive','Calm','Big Match Player','Inconsistent','Leader'];
const tri=(R,lo,hi)=>lo+(hi-lo)*(R()+R())/2;
function makePlayer(R,role,used,id,ageOv){
  let n;do{n=FN[Math.floor(R()*FN.length)]+' '+LN[Math.floor(R()*LN.length)]}while(used.has(n));used.add(n);
  let bat,bowl;
  if(role=='Spinner'||role=='Fast bowler'){bowl=tri(R,45,85);bat=tri(R,20,40)}
  else if(role=='All-rounder'){bat=tri(R,45,75);bowl=tri(R,45,75)}
  else{bat=tri(R,45,85);bowl=tri(R,15,32)}

  const p={id,n,role,age,bat:Math.round(bat),bowl:Math.round(bowl),fld:Math.round(tri(R,40,85)),pers,form:Math.round(38+R()*24)};p.pot=potFor(p,R);p.style=role=='All-rounder'?(R()<0.5?'spin':'fast'):role=='Spinner'?'spin':role=='Fast bowler'?'fast':undefined;return p;
}
function fixCaps(T){
  const xi=T.players.slice(0,11),ids=xi.map(p=>p.id),ok=id=>ids.includes(id);
  const rank=xi.map(p=>[p.id,(p.pers=='Leader'?8:p.pers=='Calm'?4:0)+primary(p)/10+p.age/20]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const cap=ok(T.cap)?T.cap:ok(T.vc)?T.vc:rank[0],vc=ok(T.vc)&&T.vc!=cap?T.vc:rank.find(id=>id!=cap);

function leadBonus(t){
  const xi=t.players;let cap=xi.find(p=>p.id==t.cap),vc=xi.find(p=>p.id==t.vc);if(!cap&&vc){cap=vc;vc=null}

function makeTeam(R,name){const used=new Set(),t={name,players:SQUAD_ROLES.slice(0,11).map((r,j)=>makePlayer(R,r,used,'p'+j))};return fixCaps(t)}
const LEAGUE_TEAMS=[['Mumbai','Mumbai','Azad Maidan Ground'],['Delhi','Delhi','Feroz Fields'],['Karnataka','Bengaluru','Lalbagh Oval'],['Tamil Nadu','Chennai','Marina Ground'],['Bengal','Kolkata','Maidan Park'],['Punjab','Mohali','Sector Park'],['Saurashtra','Rajkot','Khandheri Ground'],['Vidarbha','Nagpur','Orange Park']];
const PITCHES=['Hard surface, good bounce','Dry, spin later','Balanced','Green, early seam'];
const playoffFixtures=()=>[{id:'Q1',day:15,home:null,away:null,type:'Qualifier 1'},{id:'EL',day:16,home:null,away:null,type:'Eliminator'},{id:'Q2',day:17,home:null,away:null,type:'Qualifier 2'},{id:'F1',day:18,home:null,away:null,type:'Final'}];
function schedule(ids){
  const n=ids.length,arr=[...ids],fx=[];let id=1;
  for(let r=0;r<n-1;r++){
    for(let k=0;k<n/2;k++){let a=arr[k],b=arr[n-1-k];if((r+k)%2)[a,b]=[b,a];fx.push({id:'M'+id++,day:r+1,home:a,away:b,type:'League'})}
    arr.splice(1,0,arr.pop());

  const first=fx.length;
  for(let i=0;i<first;i++){const f=fx[i];fx.push({id:'M'+id++,day:f.day+n-1,home:f.away,away:f.home,type:'League'})}
  fx.push(...playoffFixtures());

}
const ICL_TEAMS=[['Mumbai Mavericks','Mumbai','Marine Drive Oval'],['Chennai Super Chargers','Chennai','Fort St. Ground'],['Royal Falcons Bengaluru','Bengaluru','Garden City Stadium'],['Kolkata Night Raiders','Kolkata','Hooghly Arena'],['Delhi Dynamos','Delhi','Yamuna Arena'],['Punjab Lions','Mohali','Five Rivers Stadium'],['Rajasthan Rajas','Jaipur','Pink City Stadium'],['Sunrise Hawks Hyderabad','Hyderabad','Deccan Dome'],['Gujarat Giants','Ahmedabad','Sabarmati Arena'],['Lucknow Super Knights','Lucknow','Awadh Park']];
const SHORTS={'Tamil Nadu':'TN','Royal Falcons Bengaluru':'Bengaluru','Sunrise Hawks Hyderabad':'Hyderabad'};
const sh=n=>SHORTS[n]||String(n).split(' ')[0];
const iclPlayoffFixtures=()=>[{id:'IQ1',day:15,home:null,away:null,type:'Qualifier 1'},{id:'IEL',day:16,home:null,away:null,type:'Eliminator'},{id:'IQ2',day:17,home:null,away:null,type:'Qualifier 2'},{id:'IF1',day:18,home:null,away:null,type:'Final'}];

function iclSchedule(ids){
  const n=ids.length,arr=[...ids],fx=[];let id=1;
  for(let r=0;r<n-1;r++){
    for(let k=0;k<n/2;k++){let a=arr[k],b=arr[n-1-k];if((r+k)%2)[a,b]=[b,a];fx.push({id:'IM'+id++,day:r+1,home:a,away:b,type:'League'})}
    arr.splice(1,0,arr.pop());
  }
  for(let i=0;i<n/2*(n/2);i++){const f=fx[i];fx.push({id:'IM'+id++,day:f.day+n-1,home:f.away,away:f.home,type:'League'})}
  fx.push(...iclPlayoffFixtures());

}
function makeLeague(seed){
  const R=mkRng(seed),used=new Set();
  const teams=LEAGUE_TEAMS.map(([name,city,gn],i)=>{const id='T'+(i+1);
    return{id,name,city,ground:{name:gn,pitch:PITCHES[Math.floor(R()*PITCHES.length)],straight:Math.round(tri(R,68,80)),square:Math.round(tri(R,62,72))},
      players:SQUAD_ROLES.map((r,j)=>makePlayer(R,r,used,id+'P'+(j+1)))}});
  teams.forEach(t=>{fixCaps(t);t.players.forEach(p=>{p.sal=salaryFor(p);p.end=1+Math.floor(R()*3)});t.budget=Math.max(40,Math.ceil(t.players.reduce((a,p)=>a+p.sal,0))+1)});teams.forEach(t=>t.mgr=makeMgr(R));return{seed,teams,fixtures:schedule(teams.map(t=>t.id))};
}


const NATS=[['Australia',['Jack','Liam','Mitchell','Cameron','Nathan','Aaron','Tim','Josh','Callum','Riley'],['Walker','Hughes','Cooper','Barnes','Taylor','Fraser','Lawson','Stone','Harper','Doyle']],
 ['England',['Harry','Oliver','James','Sam','Tom','Will','Ollie','Charlie','Jamie','Reece'],['Foster','Hale','Carter','Fisher','Moss','Rowe','Pratt','Hollis','Dawson','Ashby']],
 ['South Africa',['Pieter','Johan','Thabo','Andre','Ruan','Willem','Sipho','Dewald','Kobus','Lungi'],['van Wyk','Botha','Naidoo','Mokoena','Jacobs','Venter','Kruger','Mthembu','Nel','Louw']],
 ['New Zealand',['Finn','Tane','Hamish','Rhys','Jacob','Cole','Mason','Kyle','Ethan','Dane'],['Parata','Hartley','Ngata','Tuhi','Whitaker','Bayliss','Moana','Pene','Rutene','Cowan']],
 ['West Indies',['Darnell','Keron','Shaquille','Tyrone','Jerome','Marlon','Kyron','Rashad','Delroy','Troy'],['Greaves','Phillip','Edwards','Bascombe','Lashley','Haynes','Forde','Alleyne','Cuffy','Brathe']],
 ['Sri Lanka',['Kasun','Dilan','Nuwan','Lahiru','Sachith','Ravin','Dhanush','Kamil','Isuru','Janith'],['Perera','Silva','Fernando','Gunawardena','Rathnayake','Wickrama','Jayasuriya','Senanayake','Madushan','Ekanayake']],
 ['Pakistan',['Faisal','Usman','Zubair','Adnan','Kamran','Waqar','Imtiaz','Salman','Danish','Haider'],['Qureshi','Siddiqui','Malik','Butt','Chaudhry','Awan','Baig','Raza','Mirza','Gillani']],
 ['Bangladesh',['Tanvir','Rakib','Imran','Farhan','Sabbir','Nayeem','Arif','Mahin','Rafi','Jahid'],['Hossain','Ahmed','Rahman','Islam','Chowdhury','Sarkar','Mondal','Biswas','Karim','Talukder']],

const isOv=p=>(p.nat||'India')!=='India';
function makeIntl(R,c,fns,lns,role,used,id,young){
  const age=young?19+Math.floor(R()*5):Math.round(tri(R,21,34)),p=makePlayer(R,role,new Set(),id,age);let n;
  do{n=fns[Math.floor(R()*fns.length)]+' '+lns[Math.floor(R()*lns.length)]}while(used.has(n));used.add(n);
  p.n=n;p.nat=c;
  const bo=young?1:4;if(role=='Spinner'||role=='Fast bowler')p.bowl=Math.min(92,p.bowl+bo);else if(role=='All-rounder'){p.bat=Math.min(92,p.bat+bo);p.bowl=Math.min(92,p.bowl+bo)}else p.bat=Math.min(92,p.bat+bo);

function makeIntlWorld(R,used,startId){
  const out=[];let k=startId||1;

}
// ---- IPL-style auction (scaled to this world)
const AUC={purse:125,minSq:18,maxSq:21,maxOv:8,xiOv:4,slabs:[10,7,5],retain:{mega:{max:3,slabs:[10,7,5]},mini:{max:7,slabs:[10,8,6,5,4,3,2]}}};
const ICL_NEED={'Opener':3,'Top order':2,'Middle order':3,'All-rounder':3,'Spinner':3,'Fast bowler':4};
function basePrice(p){const r=primary(p);return r<45?0.2:r<55?0.3:r<62?0.5:r<68?0.75:r<74?1:r<80?1.5:2}
const incFor=x=>x<1?0.05:x<2?0.1:x<5?0.2:0.25;
const mvICL=p=>salaryFor(p)*2.3;
const r2=x=>Math.round(x*100)/100;
function autoVal(R,f,p){
  let v=mvICL(p)*(0.95+0.2*R());const c=f.roster.filter(x=>x.p.role==p.role).length,need=ICL_NEED[p.role]||0;
  const must=({'Opener':2,'Top order':1,'Middle order':2,'All-rounder':2,'Spinner':2,'Fast bowler':3})[p.role]||0;
  v*=c<must?(c==0?3:2.4):c<need?1.35:c==need?0.6:0.25;

  const unmet=Object.keys(MUST).reduce((a,r)=>a+Math.max(0,MUST[r]-f.roster.filter(x=>x.p.role==r).length-(p.role==r?1:0)),0);

function valuation(R,f,p){

  v*=c<need?1.2:c>=need+2?0.6:1;

  if(!isOv(p)&&f.roster.length-f.ov>=12)v*=0.55;

}
const canBid=(f,p,price)=>f.roster.length<AUC.maxSq&&(isOv(p)?f.ov<AUC.maxOv:(f.roster.length-f.ov)<(f.user?13:12))&&f.purse-price>=Math.max(0,AUC.minSq-f.roster.length-1)*0.2-1e-9;
function sellTo(f,p,price,ret){f.purse=r2(f.purse-price);f.roster.push({p,price:r2(price),ret:!!ret});if(isOv(p))f.ov++}
function runLot(R,fr,p,base){
  const val=new Map(fr.map(f=>[f,valuation(R,f,p)]));let price=0,leader=null;
  for(let g=0;g<300;g++){
    const next=leader?r2(price+incFor(price)):base,ints=fr.filter(f=>f!==leader&&canBid(f,p,next)&&val.get(f)>=next);
    if(!ints.length)break;
    const w=ints.map(f=>val.get(f)-next+0.1),tot=w.reduce((a,b)=>a+b,0);let x=R()*tot,i=0;while(i<ints.length-1&&x>w[i]){x-=w[i];i++}

function aiRetain(R,f,prevIds,idMap,taken,kind){

const lotOrder=(R,players,taken)=>players.filter(p=>!taken.has(p.id)).sort((a,b)=>primary(b)-primary(a)||mvICL(b)-mvICL(a));

function runAuction(R,fr,players,prev,kind){

}
